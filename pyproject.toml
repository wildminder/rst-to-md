[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rst-to-md"
dynamic = ["version"]
description = "Convert reStructuredText (.rst) files and Sphinx projects to Markdown (.md)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Wildminder" }
]
keywords = ["rst", "markdown", "pandoc", "converter", "documentation", "sphinx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
dependencies = [
    "pypandoc-binary>=1.7",
    "sphinx>=6.0",
    "html-to-markdown>=0.15",
    "beautifulsoup4>=4.12",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "build>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
rst-to-md = "rst_to_md.cli:main"

[project.urls]
Homepage = "https://github.com/wildminder/rst-to-md"
Repository = "https://github.com/wildminder/rst-to-md"

[tool.hatch.build.targets.wheel]
packages = ["rst_to_md"]

[tool.hatch.build.targets.sdist]
include = [
    "/rst_to_md",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.hatch.version]
path = "rst_to_md/__init__.py"
pattern = "__version__\\s*=\\s*\"(?P<version>[^\"]+)\""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["rst_to_md"]
omit = ["tests/*"]

[tool.coverage.report]
# NTH-008: coverage floor. Baseline measured 2026-08-15 at 69%; the floor is
# set one point below so accidental coverage loss fails CI/local runs while
# normal development stays green. Ratchet upward as coverage improves.
fail_under = 68

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["docs/reference", "rst_to_md/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["rst_to_md/_vendor"]
